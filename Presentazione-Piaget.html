<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1ece6">
<title>Costruire la conoscenza · Piaget</title>
<style>
:root{
  --paper:#f1ece6;--ink:#1f2421;--muted:#8a847a;--line:#d9d1c5;
  --accent:#2f5d48;--accent-soft:#dfe4d6;--warm:#b0733c;--warm-soft:#ead6bf;--blue:#5d7b90;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

#stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden}

.slide{position:absolute;inset:0;display:grid;grid-template-columns:580px 1fr;gap:70px;align-items:center;padding:80px 120px 140px;transition:opacity .28s ease}
.slide.out{opacity:0}
.kicker{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:30px}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
h2{font-size:76px;line-height:1.04}
h1{font-size:124px;line-height:.98}
h1 em,h2 em{color:var(--accent)}
.sub{font-size:25px;line-height:1.45;color:var(--muted);margin-top:32px;max-width:480px}
.copy>*{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform 1s var(--ease)}
.copy>*:nth-child(2){transition-delay:.08s}.copy>*:nth-child(3){transition-delay:.2s}.copy>*:nth-child(4){transition-delay:.32s}.copy>*:nth-child(5){transition-delay:.42s}
.slide.in .copy>*{opacity:1;transform:none}
.visual{opacity:0;transform:translateY(16px);transition:opacity 1s var(--ease) .15s,transform 1.2s var(--ease) .15s;display:flex;justify-content:center}
.slide.in .visual{opacity:1;transform:none}
.visual svg{width:100%;height:auto;max-height:680px;overflow:visible}
.slide.full{display:flex;justify-content:center;align-items:center;padding:60px 120px 130px}.full .visual{width:1000px}.full .visual svg{max-height:none}

/* Parole chiave */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;max-width:520px}
.chip{font-size:17px;padding:9px 18px;border:1px solid rgba(47,93,72,.45);color:var(--accent);border-radius:999px;background:rgba(223,228,214,.45)}

/* Citazioni: anteprima cliccabile */
.cites{display:flex;flex-direction:column;gap:12px;margin-top:38px;max-width:500px}
.cite{display:grid;grid-template-columns:44px 1fr 36px;gap:18px;align-items:center;text-align:left;padding:16px 18px 16px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(0,0,0,.03);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s,background .25s}
.cite:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 30px -16px rgba(31,36,33,.35);background:rgba(255,255,255,.8)}
.cite .doc{width:44px;height:54px;border-radius:5px;background:var(--accent-soft);position:relative;overflow:hidden}
.cite .doc::before{content:'';position:absolute;left:9px;right:9px;top:12px;height:3px;background:var(--accent);border-radius:2px;box-shadow:0 8px 0 rgba(47,93,72,.45),0 16px 0 rgba(47,93,72,.45),0 24px 0 rgba(47,93,72,.3)}
.cite .doc::after{content:'';position:absolute;right:0;top:0;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--paper) rgba(47,93,72,.25) transparent}
.cite small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cite b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.25;color:var(--ink)}
.cite .go{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s,color .25s;color:var(--accent)}
.cite:hover .go{background:var(--accent);border-color:var(--accent);color:#fff}
.cite .go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Pop-up dell'articolo */
dialog#paper{border:0;padding:0;margin:auto;background:var(--paper);color:var(--ink);border-radius:22px;width:min(720px,90vw);box-shadow:0 40px 120px -30px rgba(0,0,0,.55)}
dialog#paper::backdrop{background:rgba(16,20,18,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
dialog#paper[open]{animation:pop .45s var(--ease)}
dialog#paper[open]::backdrop{animation:dim .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes dim{from{opacity:0}to{opacity:1}}
.paper-in{padding:52px 56px 50px;position:relative}
.paper-in .lab{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:26px}
.paper-in .lab::before{content:'';width:30px;height:1px;background:var(--accent)}
#pTitle{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em}
#pAuthors{font-size:clamp(16px,1.6vw,19px);line-height:1.5;color:var(--muted);margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
#pDoi{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:16px;color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(47,93,72,.35);padding-bottom:2px;overflow-wrap:anywhere}
#pDoi:hover{border-color:var(--accent)}
#pClose{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--muted);transition:background .2s,color .2s}
#pClose:hover{background:var(--accent-soft);color:var(--ink)}

/* Copertina */
.cover{display:block;padding:0}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right bottom;opacity:0;transform:scale(1.06);transition:opacity 1.6s ease,transform 3s var(--ease)}
.cover.in .cover-img{opacity:1;transform:none}
.cover .copy{position:absolute;left:130px;top:300px}
.cover .kicker{margin-bottom:36px}
.author{margin-top:70px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:18px}
.author::before{content:'';width:46px;height:1px;background:var(--muted)}

/* Chiusura */
.final{display:flex;justify-content:center;text-align:center}
.final h2{font-size:92px}
.levels{display:flex;gap:70px;justify-content:center;margin-top:80px}
.lvl{width:260px;padding-top:24px;border-top:1px solid var(--line);opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease),transform 1s var(--ease),border-color .8s}
.lvl.on{opacity:1;transform:none;border-color:var(--accent)}
.lvl span{display:block;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.lvl b{font-family:var(--serif);font-weight:400;font-size:44px}

/* Elementi SVG */
.t-serif{font-family:var(--serif);font-size:32px;fill:var(--ink)}
.t-big{font-family:var(--serif);font-size:50px;fill:var(--ink);transition:fill .8s}
.t-big.dim{fill:#bdb5a9}
.t-label{font-size:15px;letter-spacing:.2em;text-transform:uppercase;fill:var(--muted)}
.t-cap{font-family:var(--serif);font-style:italic;font-size:32px;fill:var(--ink)}
.warm{fill:var(--warm)}.green{fill:var(--accent)}
.mid{text-anchor:middle}
.stroke{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.green-stroke{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.warm-stroke{fill:none;stroke:var(--warm);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.hair{fill:none;stroke:var(--line);stroke-width:1.5}
.fade{opacity:0;transition:opacity .8s var(--ease)}.fade.on{opacity:1}
.rise{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform 1s var(--ease)}.rise.on{opacity:1;transform:none}
.draw{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s var(--ease)}.draw.on{stroke-dashoffset:0}
.instant,.instant *{transition:none!important}

/* Comandi */
.tag{position:fixed;top:30px;left:44px;z-index:5;display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .6s ease;pointer-events:none}
.tag::before{content:'';width:26px;height:1px;background:currentColor}
.tag.on{opacity:1}.tag[data-k=onto]{color:var(--warm)}
.top{position:fixed;top:0;right:0;padding:24px 32px;z-index:5}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:20px 32px 28px;z-index:5;pointer-events:none}
.bottom>*{pointer-events:auto}
.count{font-size:13px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex;align-items:center;gap:10px}
.ctl{height:50px;padding:0 24px;border-radius:999px;border:1px solid var(--line);background:rgba(241,236,230,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;display:inline-flex;align-items:center;gap:10px;transition:background .2s,border-color .2s,opacity .3s,transform .15s}
.ctl:hover:not(:disabled){border-color:var(--ink)}
.ctl:active:not(:disabled){transform:scale(.97)}
.ctl svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);padding:0 28px}
.ctl.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
.ctl:disabled{opacity:.3;cursor:default}
.ctl.gone{opacity:0;pointer-events:none}
.dots{display:flex;gap:7px;margin-right:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--accent)}
.progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);transition:width .6s var(--ease);z-index:6}
@media(max-width:700px){
  .top{padding:14px}.bottom{padding:12px 14px 16px}
  .ctl{height:44px;padding:0 15px;font-size:14px}.ctl.primary{padding:0 18px}
  .ctl .lbl{display:none}.ctl.primary .lbl{display:inline}
  .count,.dots{display:none}
  .paper-in{padding:40px 26px 34px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="tag" id="tag" aria-hidden="true"></div>

<div class="top"><button class="ctl" id="restart"><svg viewBox="0 0 24 24"><path d="M4 5v6h6"/><path d="M5.5 15a7.5 7.5 0 1 0 1.7-7.8L4 11"/></svg><span class="lbl">Ricomincia dall’inizio</span></button></div>
<div class="bottom">
  <span class="count" id="count"></span>
  <div class="btns">
    <button class="ctl" id="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Indietro</span></button>
    <button class="ctl" id="replay"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span class="lbl">Ripeti</span></button>
    <button class="ctl primary" id="next"><span class="lbl">Avanti</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>
<div class="progress" id="progress"></div>

<dialog id="paper" aria-labelledby="pTitle"><div class="paper-in">
  <button id="pClose" aria-label="Chiudi">×</button>
  <p class="lab" id="pJournal"></p>
  <h3 id="pTitle"></h3>
  <p id="pAuthors"></p>
  <a id="pDoi" target="_blank" rel="noopener noreferrer"></a>
</div></dialog>

function head(x,y,dx,dy,len=17){const l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,a=Math.PI/7;const r=(c,s)=>[x-len*(ux*c-uy*s),y-len*(uy*c+ux*s)];const p1=r(Math.cos(a),Math.sin(a)),p2=r(Math.cos(a),-Math.sin(a));return `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${x} ${y} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}

function spiral(cx,cy,a,b,turns,step=.08){let d='';for(let t=0;t<=turns*2*Math.PI;t+=step){const r=a*Math.exp(b*t);d+=(d?' L':'M')+(cx+r*Math.cos(t)).toFixed(1)+' '+(cy+r*Math.sin(t)).toFixed(1)}return d}

const dlg=byId('paper');
function openPaper(k){const p=PAPERS[k];if(!p)return;byId('pJournal').textContent=p.j;byId('pTitle').textContent=p.t;byId('pAuthors').textContent=p.a+' ('+p.y+')';const a=byId('pDoi');a.href='https://doi.org/'+p.doi;a.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>doi.org/'+p.doi;try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}}
stage.addEventListener('click',e=>{const c=e.target.closest('[data-cite]');if(c)openPaper(c.dataset.cite)});
byId('pClose').onclick=()=>{dlg.close();citeIdx=-1};
dlg.addEventListener('click',e=>{if(e.target===dlg){dlg.close();citeIdx=-1}});

/* ---------- Motore ---------- */
const tagEl=byId('tag');let tagK='';
const TAGS={filo:'Filogenesi',onto:'Ontogenesi'};
function setTag(k){if(k===tagK)return;tagK=k;if(!k){tagEl.classList.remove('on');return}tagEl.textContent=TAGS[k];tagEl.dataset.k=k;tagEl.classList.add('on')}
let cur=0,step=0,busy=false;
const prevB=byId('prev'),nextB=byId('next'),replayB=byId('replay'),restartB=byId('restart');
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const splitOf=s=>s.auto?s.steps:(s.split!==undefined?s.split:Math.ceil(s.steps/2));
const gapOf=(s,k)=>(Array.isArray(s.gap)?s.gap[k-1]:(s.gap||2800))*SPEED;
let phase=0;
function clearT(){timers.forEach(clearTimeout);timers=[]}
function play(s,from,to,first){let at=first;for(let k=from;k<=to;k++){if(k>from)at+=gapOf(s,k);const kk=k;if(at<=0){step=kk;s.apply(kk,false)}else later(()=>{step=kk;s.apply(kk,false)},at)}}
function snap(s,k){const el=stage.firstElementChild;el.classList.add('instant');step=k;s.apply(k,true);void el.offsetWidth;el.classList.remove('instant')}
function render(i,atEnd=false){
  clearT();citeIdx=-1;if(dlg.open)dlg.close();
  const s=SL[i];cur=i;setTag(s.tag||'');step=atEnd?s.steps-1:0;phase=(atEnd&&s.steps>1&&!s.auto)?1:0;
  stage.innerHTML=`<section class="slide ${s.cls||''}">${s.html}</section>`;
  const el=stage.firstElementChild;
  if(atEnd){el.classList.add('instant');s.apply(step,true);void el.offsetWidth;el.classList.remove('instant')}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('in');if(atEnd)return;s.apply(0,false);play(s,1,splitOf(s)-1,250)}));
  ui();
}
function go(i,atEnd=false){
  if(busy||i<0||i>=SL.length)return;
  const el=stage.firstElementChild;busy=true;
  if(el)el.classList.add('out');
  setTimeout(()=>{busy=false;render(i,atEnd);try{history.replaceState(null,'','#'+(i+1))}catch(e){}},el?260:0);
}
function next(){
  if(busy)return;const s=SL[cur];
  if(s.auto&&s.steps>1&&step<s.steps-1){clearT();snap(s,s.steps-1);return}
  if(s.steps>1&&phase===0&&!s.auto){clearT();const sp=splitOf(s);if(step<sp-1)snap(s,sp-1);phase=1;play(s,sp,s.steps-1,0);ui();return}
  go(cur+1)}
function prev(){
  if(busy)return;const s=SL[cur];
  if(s.steps>1&&phase===1){clearT();snap(s,splitOf(s)-1);phase=0;ui();return}
  go(cur-1,true)}
function replay(){
  if(busy)return;const s=SL[cur];if(s.steps<2)return;
  if(phase===1&&!s.auto){clearT();snap(s,splitOf(s)-1);play(s,splitOf(s),s.steps-1,200)}else render(cur)}
function ui(){
  const s=SL[cur],last=SL.length-1;
  prevB.disabled=cur===0;nextB.disabled=cur===last;restartB.disabled=cur===0;
  replayB.classList.toggle('gone',s.steps<2);
  byId('count').textContent=String(cur+1).padStart(2,'0')+' / '+SL.length;
  byId('progress').style.width=((cur+1)/SL.length*100)+'%';
}
nextB.onclick=next;prevB.onclick=prev;replayB.onclick=replay;restartB.onclick=()=>go(0);
let citeIdx=-1;
function toggleCite(){const cs=$$('[data-cite]');if(!cs.length)return;if(dlg.open){dlg.close();if(citeIdx+1<cs.length){citeIdx++;openPaper(cs[citeIdx].dataset.cite)}else citeIdx=-1}else{citeIdx=0;openPaper(cs[0].dataset.cite)}}
addEventListener('keydown',e=>{if((e.key==='a'||e.key==='A')&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggleCite();return}
  if(dlg.open||e.metaKey||e.ctrlKey||e.altKey)return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){if(e.key==='Enter'&&e.target.closest('button'))return;e.preventDefault();next()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='r'||e.key==='R')replay();
  else if(e.key==='Home')go(0)});
document.addEventListener('click',e=>{if(dlg.open||e.target.closest('button,a,dialog,[data-cite]'))return;next()});
let tx=null;addEventListener('touchstart',e=>{if(dlg.open||e.target.closest('button,a'))return;tx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
addEventListener('touchend',e=>{if(!tx)return;const dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];tx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)dx<0?next():prev()},{passive:true});
let h=0;try{h=parseInt(location.hash.slice(1),10)}catch(e){}
render(h>=1&&h<=SL.length?h-1:0);
</script>
</body>
</html>
